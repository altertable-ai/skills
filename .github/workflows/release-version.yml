name: Release version

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-version
  cancel-in-progress: false

jobs:
  release-version:
    runs-on: ubuntu-latest
    env:
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update manifest versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.metadata.version = $v | .plugins[].version = $v' \
            .claude-plugin/marketplace.json > tmp.json && mv tmp.json .claude-plugin/marketplace.json
          jq --arg v "$VERSION" '.version = $v' \
            .claude-plugin/plugin.json > tmp.json && mv tmp.json .claude-plugin/plugin.json
          jq --arg v "$VERSION" '.version = $v' \
            .codex-plugin/plugin.json > tmp.json && mv tmp.json .codex-plugin/plugin.json

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          version: "0.11.29"

      - name: Sync AGENTS.md available skills
        run: uv run --locked python scripts/sync-agents-md.py

      - name: Install Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash -s 2.1.212

      - name: Validate release package
        run: |
          uv run --locked python scripts/score-skills.py ./skills --scan_all --validate_only
          uv run --locked pytest scripts/tests/ -q
          ~/.local/bin/claude plugin validate .claude-plugin/plugin.json --strict
          ~/.local/bin/claude plugin validate .claude-plugin/marketplace.json --strict

      - name: Commit, push, and move tag to release commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json .claude-plugin/plugin.json .codex-plugin/plugin.json AGENTS.md
          if git diff --staged --quiet; then
            echo "Manifests already at $VERSION, nothing to commit"
            exit 0
          fi
          git commit -m "chore(release): $VERSION"
          git push origin main
          git tag -f "v$VERSION"
          git push --force origin "refs/tags/v$VERSION"
