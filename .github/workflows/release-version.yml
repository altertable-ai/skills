name: Validate release version

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-version:
    runs-on: ubuntu-latest
    env:
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Match manifests to tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$version" = "$(jq -r .metadata.version .claude-plugin/marketplace.json)"
          test "$(jq -r '.plugins | length' .claude-plugin/marketplace.json)" -gt 0
          jq -e --arg version "$version" 'all(.plugins[]; .version == $version)' .claude-plugin/marketplace.json
          test "$version" = "$(jq -r .version .claude-plugin/plugin.json)"
          test "$version" = "$(jq -r .version .codex-plugin/plugin.json)"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          version: "0.11.29"

      - name: Install Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash -s 2.1.212

      - name: Validate release package
        run: |
          uv run --locked python scripts/score-skills.py ./skills --scan_all --validate_only
          uv run --locked pytest scripts/tests/ -q
          ~/.local/bin/claude plugin validate .claude-plugin/plugin.json --strict
          ~/.local/bin/claude plugin validate .claude-plugin/marketplace.json --strict
